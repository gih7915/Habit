<!doctype html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Habit | Criar conta</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet"><link rel="stylesheet" href="../css/style.css"></head>
<body class="auth-page"><main class="auth-shell"><section class="auth-visual"><a class="auth-brand" href="login.html"><span>z</span>Habit</a><div><p class="modal-kicker">Um novo começo</p><h1>Seu ritmo também merece espaço.</h1><p>Crie um lugar para acompanhar o que importa, um pequeno passo por vez.</p></div><span class="auth-spark">✦</span></section><section class="auth-form-side"><form class="auth-form" id="signupForm"><p class="modal-kicker">Comece por aqui</p><h2>Crie sua conta</h2><p class="auth-subtitle">Leva menos de um minuto.</p><label for="signupName">Como podemos te chamar?</label><input id="signupName" required placeholder="Seu nome"><label for="signupEmail">E-mail</label><input id="signupEmail" type="email" required placeholder="voce@email.com"><label for="signupPassword">Senha</label><input id="signupPassword" type="password" minlength="6" required placeholder="Mínimo de 6 caracteres"><label class="terms"><input type="checkbox" required> Concordo em começar com calma.</label><button class="auth-submit" type="submit">Criar minha conta</button><p class="auth-feedback" id="signupFeedback"></p><p class="auth-switch">Já tem uma conta? <a href="login.html">Entrar</a></p></form></section></main><script src="../js/auth.js"></script></body></html>
