<main class="main"><header class="header"><button class="menu" id="menu" aria-label="Abrir menu">☰</button><h1>Tarefas</h1><button class="new-task" id="openTask">＋ Nova tarefa</button></header><section class="task-toolbar"><div class="task-tabs" role="tablist"><button class="selected" data-filter="all">Todas</button><button data-filter="today">Hoje</button><button data-filter="pending">Pendentes</button><button data-filter="done">Concluídas</button></div><div class="task-date"><button id="previousDay" aria-label="Dia anterior">‹</button><strong id="selectedDate"></strong><button id="nextDay" aria-label="Próximo dia">›</button></div></section><section class="task-layout"><div class="task-list card"><div class="task-list-heading"><div><p class="modal-kicker">Sua agenda</p><h2 id="taskHeading">Tarefas para hoje</h2></div><span id="taskCount">0 tarefas</span></div><div id="tasksList"></div></div><aside class="task-calendar card"><div class="calendar-heading"><button id="previousMonth" aria-label="Mês anterior">‹</button><h2 id="calendarTitle"></h2><button id="nextMonth" aria-label="Próximo mês">›</button></div><div class="weekdays"><span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span></div><div class="calendar-grid" id="taskCalendar"></div><p class="calendar-legend"><i></i> Tem tarefa agendada</p></aside></section></main></div>
<div class="modal-backdrop" id="taskModal"><form class="task-modal" id="taskForm"><div class="modal-heading"><div><p class="modal-kicker">Planejar</p><h2>Nova tarefa</h2></div><button type="button" class="modal-close" id="closeTask" aria-label="Fechar">×</button></div><label for="taskName">O que precisa ser feito?</label><input id="taskName" required placeholder="Ex.: Estudar para a prova"><label for="taskDate">Quando?</label><input id="taskDate" type="date" required><label for="taskTime">Horário (opcional)</label><input id="taskTime" type="time"><label for="taskRecurrence">Repetir tarefa</label><select id="taskRecurrence"><option value="none">Não repetir</option><option value="daily">Todos os dias</option><option value="weekdays">Dias úteis</option><option value="weekly">Toda semana</option><option value="monthly">Todo mês</option><option value="selected-days">Em dias específicos da semana</option></select><div id="customRecurrenceFields"><label>Repetir em</label><div class="recurrence-days"><label><input type="checkbox" value="0">Dom</label><label><input type="checkbox" value="1">Seg</label><label><input type="checkbox" value="2">Ter</label><label><input type="checkbox" value="3">Qua</label><label><input type="checkbox" value="4">Qui</label><label><input type="checkbox" value="5">Sex</label><label><input type="checkbox" value="6">Sáb</label></div><label for="taskRecurrenceEnd">Termina</label><select id="taskRecurrenceEnd"><option value="never">Nunca</option><option value="date">Em uma data</option></select><div id="taskRecurrenceEndDateField"><label for="taskRecurrenceEndDate">Data final</label><input id="taskRecurrenceEndDate" type="date"></div></div><label for="taskPriority">Prioridade</label><select id="taskPriority"><option value="low">Tranquila</option><option value="medium" selected>Importante</option><option value="high">Urgente</option></select><label for="taskCategory">Categoria</label><select id="taskCategory"><option>Rotina</option><option>Trabalho</option><option>Estudos</option><option>Casa</option><option>Pessoal</option></select><div class="task-modal-actions"><button type="button" id="cancelTask">Cancelar</button><button type="submit">Agendar tarefa</button></div></form></div><script src="../js/tarefas.js"></script></body></html>
